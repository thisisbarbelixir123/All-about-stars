    <script>
      // Gracefully ignore harmless Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(e) {
        if (e && (e.message && e.message.indexOf('WebSocket') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e && (e.reason && (e.reason.message || e.reason.stack) || e.reason || ''));
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
