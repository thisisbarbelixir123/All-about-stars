    <script>
      // Gracefully ignore harmless Vite HMR WebSocket connection errors in sandbox iframe environment
      (function() {
        function isViteHmrError(eventOrReason) {
          if (!eventOrReason) return false;
          var str = '';
          try {
            if (typeof eventOrReason === 'string') {
              str = eventOrReason;
            } else {
              str = [
                eventOrReason.message,
                eventOrReason.filename,
                eventOrReason.stack,
                eventOrReason.type,
                eventOrReason.reason && (eventOrReason.reason.message || eventOrReason.reason.stack || eventOrReason.reason),
                eventOrReason.target && eventOrReason.target.constructor && eventOrReason.target.constructor.name,
                eventOrReason.target && eventOrReason.target.url
              ].filter(Boolean).join(' ');
            }
          } catch (_) {}
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
                 (str.indexOf('vite') !== -1 && str.indexOf('connect') !== -1);
        }

        window.addEventListener('error', function(e) {
          if (isViteHmrError(e) || isViteHmrError(e.error) || (e.target && e.target instanceof WebSocket)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteHmrError(e) || isViteHmrError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
