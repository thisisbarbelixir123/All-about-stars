<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#050e26" />
      <stop offset="60%" stop-color="#020612" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <clipPath id="favInnerClip">
      <rect x="36" y="36" width="440" height="440" rx="72" ry="72" />
    </clipPath>
    <radialGradient id="favSun" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFF0" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="85%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>
    <radialGradient id="favSaturn" cx="60%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#EED5A5" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#9C7A4A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B1713" stop-opacity="0.98" />
    </radialGradient>
    <linearGradient id="favBands" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBB285" />
      <stop offset="35%" stop-color="#F2E4C4" />
      <stop offset="65%" stop-color="#B8945F" />
      <stop offset="100%" stop-color="#3D2B14" />
    </linearGradient>
    <clipPath id="favSaturnClip">
      <circle cx="232" cy="300" r="126" />
    </clipPath>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <g clip-path="url(#favInnerClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#favBg)" />
  </g>
  <!-- Sun -->
  <circle cx="365" cy="148" r="150" fill="url(#favSun)" opacity="0.4" />
  <circle cx="365" cy="148" r="98" fill="url(#favSun)" />
  <!-- Cyan Frame -->
  <rect x="36" y="36" width="440" height="440" rx="72" ry="72" fill="none" stroke="url(#favBorder)" stroke-width="16" />
  <!-- Saturn Back Rings -->
  <g transform="translate(232, 300) rotate(-22)">
    <g clip-path="polygon(-450 -350, 450 -350, 450 0, -450 0)">
      <ellipse cx="0" cy="0" rx="288" ry="72" fill="none" stroke="#7A6A55" stroke-width="18" opacity="0.85" />
      <ellipse cx="0" cy="0" rx="254" ry="63" fill="none" stroke="#E6D6B6" stroke-width="24" opacity="0.95" />
    </g>
  </g>
  <!-- Saturn Sphere -->
  <circle cx="232" cy="300" r="126" fill="#D2BC90" />
  <g clip-path="url(#favSaturnClip)">
    <rect x="95" y="165" width="275" height="275" fill="url(#favBands)" />
    <circle cx="232" cy="300" r="126" fill="url(#favSaturn)" />
  </g>
  <!-- Saturn Front Rings -->
  <g transform="translate(232, 300) rotate(-22)">
    <g clip-path="polygon(-450 0, 450 0, 450 350, -450 350)">
      <ellipse cx="0" cy="0" rx="254" ry="63" fill="none" stroke="#E6D6B6" stroke-width="24" opacity="0.95" />
      <ellipse cx="0" cy="0" rx="288" ry="72" fill="none" stroke="#7A6A55" stroke-width="18" opacity="0.85" />
    </g>
  </g>
</svg>
