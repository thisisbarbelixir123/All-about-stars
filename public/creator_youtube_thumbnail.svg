<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="thumbBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Sun Glow Filter -->
    <radialGradient id="sunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffeb3b" />
      <stop offset="70%" stop-color="#ff9800" />
      <stop offset="90%" stop-color="#ff5722" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0" />
    </radialGradient>

    <!-- Earth Gradient -->
    <radialGradient id="earthShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Moon Gradient -->
    <radialGradient id="moonShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Saturn Planet & Rings -->
    <radialGradient id="saturnBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="35%" stop-color="#fde68a" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Nebula Glow -->
    <radialGradient id="ringNebulaOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#f97316" stop-opacity="0.95" />
      <stop offset="95%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sunCorona" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Space Canvas -->
  <rect width="1280" height="720" fill="url(#thumbBg)" />

  <!-- Subtle star particles in background -->
  <g opacity="0.4">
    <circle cx="95" cy="80" r="1.2" fill="#fff" />
    <circle cx="210" cy="140" r="0.8" fill="#fff" />
    <circle cx="1180" cy="90" r="1.5" fill="#fff" />
    <circle cx="1060" cy="130" r="1" fill="#fff" />
    <circle cx="70" cy="640" r="1.2" fill="#fff" />
    <circle cx="1200" cy="650" r="1" fill="#fff" />
  </g>

  <!-- Title Header Block -->
  <g text-anchor="middle" font-family="'Montserrat', 'Inter', -apple-system, sans-serif">
    <text x="640" y="80" fill="#f1f5f9" font-size="22" font-weight="700" letter-spacing="4.5">
      THE SIZE OF THE UNIVERSE 6
    </text>
    <text x="640" y="152" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="1">
      “THE ULTIMATE”
    </text>
  </g>

  <!-- ================= ROW 1: MACRO / ASTRONOMY (Y: ~280) ================= -->
  <!-- 1.1 Moon -->
  <g transform="translate(85, 290)">
    <circle cx="0" cy="0" r="48" fill="url(#moonShade)" />
    <!-- Craters -->
    <circle cx="-15" cy="-10" r="10" fill="#64748b" opacity="0.5" />
    <circle cx="10" cy="-20" r="8" fill="#475569" opacity="0.6" />
    <circle cx="18" cy="12" r="12" fill="#334155" opacity="0.5" />
    <circle cx="-22" cy="18" r="7" fill="#475569" opacity="0.5" />
    <circle cx="-5" cy="5" r="16" fill="#334155" opacity="0.4" />
    <circle cx="5" cy="28" r="9" fill="#1e293b" opacity="0.4" />
  </g>

  <!-- 1.2 Earth -->
  <g transform="translate(235, 290)">
    <circle cx="0" cy="0" r="48" fill="url(#earthShade)" />
    <!-- Continents & Oceans -->
    <path d="M-22,-30 Q-10,-40 5,-28 Q18,-15 12,-2 Q20,12 8,28 Q-8,35 -20,20 Q-32,5 -30,-15 Z" fill="#22c55e" opacity="0.75" />
    <path d="M-8,-25 Q10,-32 18,-18 Q12,-5 2,-2 Q-10,-10 -8,-25 Z" fill="#eab308" opacity="0.65" />
    <path d="M-15,5 Q5,8 10,22 Q-2,30 -12,24 Z" fill="#16a34a" opacity="0.8" />
    <!-- Cloud Swirls -->
    <path d="M-35,-15 Q-15,-25 15,-18 Q35,-12 40,5" stroke="#ffffff" stroke-width="4.5" fill="none" opacity="0.8" stroke-linecap="round" />
    <path d="M-40,8 Q-10,12 10,0 Q30,-5 42,12" stroke="#ffffff" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round" />
    <path d="M-25,25 Q0,32 28,20" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- 1.3 Saturn & Rings -->
  <g transform="translate(410, 290)">
    <!-- Back of Rings -->
    <ellipse cx="0" cy="0" rx="90" ry="26" fill="none" stroke="#e2d4a8" stroke-width="12" opacity="0.4" transform="rotate(-15)" />
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="none" stroke="#b49b66" stroke-width="6" opacity="0.7" transform="rotate(-15)" />
    <!-- Planet Body -->
    <circle cx="0" cy="0" r="42" fill="url(#saturnBody)" />
    <!-- Atmospheric Bands -->
    <path d="M-40,-10 Q0,-5 40,-10" stroke="#d97706" stroke-width="3" fill="none" opacity="0.4" />
    <path d="M-42,5 Q0,10 42,5" stroke="#b45309" stroke-width="3.5" fill="none" opacity="0.4" />
    <!-- Front of Rings -->
    <g transform="rotate(-15)" clip-path="polygon(-100 0, 100 0, 100 50, -100 50)">
      <ellipse cx="0" cy="0" rx="90" ry="26" fill="none" stroke="#fef08a" stroke-width="12" opacity="0.95" />
      <ellipse cx="0" cy="0" rx="80" ry="22" fill="none" stroke="#ca8a04" stroke-width="6" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="68" ry="18" fill="none" stroke="#713f12" stroke-width="3" opacity="0.9" />
    </g>
  </g>

  <!-- 1.4 Sun -->
  <g transform="translate(585, 290)">
    <circle cx="0" cy="0" r="58" fill="url(#sunFlare)" filter="url(#sunCorona)" />
    <circle cx="0" cy="0" r="48" fill="#f59e0b" />
    <!-- Solar Flare Granules -->
    <circle cx="0" cy="0" r="45" fill="#fef08a" opacity="0.9" />
    <circle cx="-12" cy="-8" r="8" fill="#ea580c" opacity="0.4" />
    <circle cx="15" cy="10" r="10" fill="#ea580c" opacity="0.4" />
    <circle cx="5" cy="-18" r="7" fill="#dc2626" opacity="0.3" />
  </g>

  <!-- 1.5 Ring Nebula -->
  <g transform="translate(740, 290)">
    <ellipse cx="0" cy="0" rx="48" ry="40" fill="url(#ringNebulaOuter)" transform="rotate(25)" />
    <ellipse cx="0" cy="0" rx="24" ry="18" fill="#0284c7" opacity="0.95" transform="rotate(25)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#softGlow)" />
  </g>

  <!-- 1.6 Colliding Galaxies (Antennae) -->
  <g transform="translate(895, 290)">
    <rect x="-48" y="-48" width="96" height="96" rx="8" fill="#060913" />
    <!-- Tidal Tails -->
    <path d="M-20,10 Q-38,-25 -15,-38 Q10,-42 25,-20" stroke="#f472b6" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round" />
    <path d="M15,-10 Q38,25 15,38 Q-10,42 -25,20" stroke="#60a5fa" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round" />
    <!-- Galactic Nuclei -->
    <circle cx="-5" cy="-6" r="10" fill="#fbcfe8" filter="url(#softGlow)" />
    <circle cx="8" cy="8" r="12" fill="#fed7aa" filter="url(#softGlow)" />
    <!-- Starburst clusters -->
    <circle cx="-12" cy="-18" r="2.5" fill="#38bdf8" />
    <circle cx="2" cy="-28" r="2" fill="#ec4899" />
    <circle cx="20" cy="18" r="3" fill="#38bdf8" />
    <circle cx="-15" cy="22" r="2" fill="#fbbf24" />
  </g>

  <!-- 1.7 Cosmic Web Cube -->
  <g transform="translate(1055, 290)">
    <!-- 3D Cube Outline -->
    <!-- Front Face -->
    <rect x="-38" y="-20" width="60" height="60" fill="#030712" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
    <!-- Top Face -->
    <polygon points="-38,-20 -15,-45 45,-45 22,-20" fill="#0f172a" stroke="#93c5fd" stroke-width="1.5" opacity="0.7" />
    <!-- Right Face -->
    <polygon points="22,-20 45,-45 45,15 22,40" fill="#0b0f19" stroke="#93c5fd" stroke-width="1.5" opacity="0.7" />
    <!-- Cosmic Web Filaments Inside -->
    <path d="M-25,10 Q0,-10 20,-30 M-10,-35 Q5,-15 30,-5 M-30,-5 Q10,15 35,25 M5,-40 Q-5,0 15,30" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.85" />
    <path d="M-30,20 Q0,5 20,35 M-15,-15 Q15,-20 35,-35" stroke="#818cf8" stroke-width="1.2" fill="none" opacity="0.75" />
    <!-- Nodes / Galaxy Clusters -->
    <circle cx="0" cy="-10" r="2.5" fill="#ffffff" />
    <circle cx="20" cy="-30" r="2" fill="#e0f2fe" />
    <circle cx="-10" cy="15" r="2" fill="#e0f2fe" />
    <circle cx="15" cy="20" r="2" fill="#e0f2fe" />
  </g>


  <!-- ================= ROW 2: MESO / EARTH SCALE (Y: ~445) ================= -->
  <!-- 2.1 Snowflake -->
  <g transform="translate(85, 445)">
    <rect x="-44" y="-44" width="88" height="88" rx="8" fill="#1e3a8a" />
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <!-- 6 main branches -->
      <line x1="0" y1="-32" x2="0" y2="32" />
      <line x1="-28" y1="-16" x2="28" y2="16" />
      <line x1="-28" y1="16" x2="28" y2="-16" />
      <!-- Sub-dendrites -->
      <path d="M-8,-20 L0,-14 L8,-20 M-8,20 L0,14 L8,20" fill="none" />
      <path d="M-20,-4 L-14,0 L-20,4 M20,-4 L14,0 L20,4" fill="none" />
      <circle cx="0" cy="0" r="4" fill="#60a5fa" />
    </g>
  </g>

  <!-- 2.2 Moth / Butterfly -->
  <g transform="translate(235, 445)">
    <rect x="-48" y="-40" width="96" height="80" rx="8" fill="#166534" />
    <!-- Butterfly Wings -->
    <path d="M-4,-5 Q-38,-35 -36,-10 Q-34,18 -4,15 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <path d="M4,-5 Q38,-35 36,-10 Q34,18 4,15 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <!-- Wing Spots -->
    <circle cx="-20" cy="-12" r="3" fill="#fef08a" />
    <circle cx="-14" cy="2" r="2.5" fill="#fef08a" />
    <circle cx="20" cy="-12" r="3" fill="#fef08a" />
    <circle cx="14" cy="2" r="2.5" fill="#fef08a" />
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="3.5" ry="16" fill="#1c1917" />
    <!-- Antennae -->
    <path d="M-2,-14 Q-8,-24 -12,-22 M2,-14 Q8,-24 12,-22" stroke="#1c1917" stroke-width="1.5" fill="none" />
  </g>

  <!-- 2.3 Human Silhouette Waving -->
  <g transform="translate(390, 445)">
    <!-- White Human Figure -->
    <circle cx="0" cy="-32" r="8" fill="#ffffff" />
    <!-- Body Torso -->
    <path d="M-8,-22 L8,-22 L6,8 L-6,8 Z" fill="#ffffff" />
    <!-- Legs -->
    <path d="M-6,8 L-8,36 L-3,36 L-2,10 L2,10 L3,36 L8,36 L6,8 Z" fill="#ffffff" />
    <!-- Right Hand Waving Up -->
    <path d="M-8,-20 L-18,-35 L-15,-38 L-6,-18 Z" fill="#ffffff" />
    <!-- Left Hand at Side -->
    <path d="M8,-20 L14,2 L10,3 L6,-18 Z" fill="#ffffff" />
  </g>

  <!-- 2.4 Skyscraper (Gran Torre / City Building) -->
  <g transform="translate(485, 445)">
    <rect x="-24" y="-45" width="48" height="90" rx="4" fill="#0f172a" />
    <!-- Sunset Gradient Tower -->
    <linearGradient id="towerGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <polygon points="-12,-40 12,-40 16,35 -16,35" fill="url(#towerGlass)" />
    <!-- Window Gridlines -->
    <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- 2.5 Mountain Peak -->
  <g transform="translate(635, 445)">
    <!-- Sky & Mountain Backdrop -->
    <rect x="-48" y="-40" width="96" height="80" rx="8" fill="#1e293b" />
    <!-- Rocky Mountain Ridge -->
    <polygon points="-44,35 -15,-25 10,-8 30,-32 44,35" fill="#7c2d12" />
    <!-- Snowcaps -->
    <polygon points="-15,-25 -6,-8 -12,0 -24,-8" fill="#ffffff" />
    <polygon points="30,-32 40,-10 32,-4 22,-14" fill="#ffffff" />
  </g>

  <!-- 2.6 Asteroid -->
  <g transform="translate(790, 445)">
    <!-- Irregular Asteroid Shape -->
    <path d="M-40,-10 Q-35,-28 -10,-32 Q25,-35 42,-12 Q45,15 25,28 Q-5,34 -32,22 Q-45,8 -40,-10 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
    <!-- Crater Depressions -->
    <ellipse cx="-15" cy="-8" rx="10" ry="7" fill="#475569" opacity="0.7" />
    <ellipse cx="18" cy="5" rx="8" ry="6" fill="#334155" opacity="0.8" />
    <ellipse cx="-5" cy="14" rx="7" ry="4" fill="#475569" opacity="0.6" />
  </g>

  <!-- 2.7 Denmark Map Flag -->
  <g transform="translate(935, 445)">
    <!-- Map Silhouette with Dannebrog Flag -->
    <path d="M-30,-28 Q-10,-35 5,-25 Q28,-20 25,5 Q18,32 -10,32 Q-32,20 -30,-28 Z" fill="#dc2626" />
    <!-- White Cross of Denmark -->
    <rect x="-14" y="-32" width="8" height="64" fill="#ffffff" />
    <rect x="-34" y="-4" width="64" height="8" fill="#ffffff" />
  </g>


  <!-- ================= ROW 3: MICRO / NANO / SUBATOMIC (Y: ~595) ================= -->
  <!-- 3.1 Quantum Wavepacket / Proton Field -->
  <g transform="translate(160, 595)">
    <circle cx="0" cy="0" r="42" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M-35,0 Q-15,-30 0,0 Q15,30 35,0" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M-30,-15 Q0,30 30,-15" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.7" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#softGlow)" />
  </g>

  <!-- 3.2 Bohr Oxygen Atom -->
  <g transform="translate(305, 595)">
    <!-- Electron Shells -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="12" fill="#86efac" />
    <text x="0" y="4.5" fill="#064e3b" font-size="14" font-weight="900" text-anchor="middle" font-family="sans-serif">O</text>
    <!-- Electrons -->
    <circle cx="0" cy="-18" r="3" fill="#38bdf8" />
    <circle cx="0" cy="18" r="3" fill="#38bdf8" />
    <circle cx="-36" cy="0" r="3" fill="#38bdf8" />
    <circle cx="36" cy="0" r="3" fill="#38bdf8" />
    <circle cx="-25" cy="-25" r="3" fill="#38bdf8" />
    <circle cx="25" cy="25" r="3" fill="#38bdf8" />
  </g>

  <!-- 3.3 Propane Molecule (Space-filling) -->
  <g transform="translate(485, 595)">
    <!-- Carbons (Grey) & Hydrogens (White) -->
    <circle cx="-28" cy="0" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="20" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
    <circle cx="28" cy="0" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="-14" cy="-18" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="14" cy="-18" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="0" cy="18" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- 3.4 DNA Double Helix Structure -->
  <g transform="translate(685, 595)">
    <!-- Twisting molecular sphere clusters -->
    <g stroke="#ffffff" stroke-width="1.5">
      <!-- Strands -->
      <circle cx="-35" cy="-15" r="7" fill="#ef4444" />
      <circle cx="-25" cy="-5" r="6" fill="#3b82f6" />
      <circle cx="-15" cy="10" r="7" fill="#f8fafc" />
      <circle cx="0" cy="-8" r="7" fill="#ef4444" />
      <circle cx="15" cy="-15" r="6" fill="#3b82f6" />
      <circle cx="25" cy="8" r="7" fill="#f8fafc" />
      <circle cx="35" cy="-12" r="7" fill="#ef4444" />

      <circle cx="-30" cy="18" r="6" fill="#3b82f6" />
      <circle cx="-10" cy="-20" r="7" fill="#ef4444" />
      <circle cx="5" cy="18" r="6" fill="#f8fafc" />
      <circle cx="30" cy="-4" r="6" fill="#3b82f6" />
    </g>
  </g>

  <!-- 3.5 Virus Capsid -->
  <g transform="translate(865, 595)">
    <!-- Spherical Capsid with Spike Glycoproteins -->
    <circle cx="0" cy="0" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- Spikes radiating outward -->
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-38" />
      <line x1="0" y1="28" x2="0" y2="38" />
      <line x1="-28" y1="0" x2="-38" y2="0" />
      <line x1="28" y1="0" x2="38" y2="0" />
      <line x1="-20" y1="-20" x2="-28" y2="-28" />
      <line x1="20" y1="20" x2="28" y2="28" />
      <line x1="-20" y1="20" x2="-28" y2="28" />
      <line x1="20" y1="-20" x2="28" y2="-28" />
    </g>
    <!-- Capsomer Pores -->
    <circle cx="-8" cy="-8" r="4" fill="#94a3b8" />
    <circle cx="10" cy="-6" r="4" fill="#94a3b8" />
    <circle cx="0" cy="10" r="4.5" fill="#94a3b8" />
  </g>

  <!-- 3.6 Bacterium / Microbe -->
  <g transform="translate(1015, 595)">
    <!-- Paired Diplococcus / Bacilli Shape -->
    <g transform="rotate(-25)">
      <ellipse cx="-10" cy="0" rx="18" ry="24" fill="#15803d" stroke="#166534" stroke-width="2" />
      <ellipse cx="12" cy="0" rx="16" ry="22" fill="#22c55e" stroke="#166534" stroke-width="2" />
      <!-- Texture Stippling -->
      <circle cx="-12" cy="-6" r="2" fill="#86efac" opacity="0.6" />
      <circle cx="-6" cy="8" r="2" fill="#86efac" opacity="0.6" />
      <circle cx="10" cy="-4" r="2" fill="#dcfce7" opacity="0.7" />
      <circle cx="14" cy="8" r="2" fill="#dcfce7" opacity="0.7" />
    </g>
  </g>
</svg>
